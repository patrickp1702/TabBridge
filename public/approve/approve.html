<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TabBridge — approval needed</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="../ui/theme.css" />
  <link rel="stylesheet" href="approve.css" />
</head>
<body>
  <header class="head">
    <div class="head__brand">TabBridge</div>
    <div class="head__count" id="countdown"></div>
  </header>
  <main id="main">
    <h1 id="title" class="title">Loading request…</h1>
    <p class="caller">Requested by <code id="caller"></code></p>
    <dl id="fields" class="fields"></dl>
    <section id="code-wrap" class="code-wrap" style="display:none">
      <div class="code-label" id="code-label"></div>
      <pre id="code" class="code"></pre>
    </section>
    <p class="warn" id="warn">Allowing runs code inside your browser session with your cookies. Deny if you did not expect this.</p>
  </main>
  <footer class="actions">
    <button id="btn-deny" class="btn btn--ghost">Deny</button>
    <button id="btn-allow" class="btn btn--primary">Allow</button>
  </footer>
  <script src="approve.js"></script>
</body>
</html>
